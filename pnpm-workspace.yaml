packages:
  - 'packages/*'
minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true # fail instead of falling back to a too-new version
minimumReleaseAgeIgnoreMissingTime: false # missing publish-time metadata fails closed
blockExoticSubdeps: true
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
trustPolicy: no-downgrade # fail if a later version has weaker trust evidence
minimumReleaseAgeExclude:
  - '@babel/*'
  # undici 7.30.1 and 8.12.2 fix the High advisories. Both releases are younger than 7 days.
  - 'undici@7.30.1 || 8.12.2'
  # body-parser 2.4.0 fixes GHSA-27r3-jxmh-p828. The release is younger than 7 days.
  - 'body-parser@2.4.0'
allowBuilds:
  esbuild: true
  protobufjs: true
  rolldown: true
  rollup: true
  sharp: true
  unrs-resolver: true
  workerd: true
# Pin transitive deps that later published without provenance (trust downgrade).
# These pins select patched releases for transitive security advisories.
overrides:
  chokidar: 4.0.1
  # CVE-2026-90711. express accepts proxy-addr ^2.0.7.
  proxy-addr: 2.0.8
  # CVE-2026-19534 and CVE-2026-84961. miniflare pins undici 7.29.1.
  # That pin cannot reach 7.30.1. The same pin covers AIKIDO-2026-846025,
  # AIKIDO-2026-393834, and AIKIDO-2026-159850.
  "undici@>=7.0.0 <8.0.0": 7.30.1
  # CVE-2026-27903 and CVE-2026-27904. minimatch 3.1.5 includes the 3.x fix.
  "minimatch@>=10.0.0 <11.0.0": 10.2.6
  # CVE-2026-102276, CVE-2026-102278, and the other brace-expansion DoS fixes.
  "brace-expansion@>=1.0.0 <2.0.0": 1.1.21
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.7
  "brace-expansion@>=3.0.0 <4.0.0": 3.0.9
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.12
  # GHSA-587h-7wmj-h5pm (CVE-2026-112942). Vite 7.3.7 has the 8.3.3 fix.
  # Vitest accepts vite 7. The peer range selects 7.3.1.
  # This pin also keeps the earlier vite advisories closed.
  vite: 7.3.7
  # GHSA-r28c-9q8g-f849. Vite accepts postcss ^8.5.6.
  postcss: 8.5.18
  # GHSA-28wg-ghj8-5hjv and GHSA-2v37-7h3g-55p8. PostCSS accepts nanoid ^3.3.12.
  nanoid: 3.3.18
